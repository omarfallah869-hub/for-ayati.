<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آياتي 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f0a14 0%, #1f0d2b 100%);
            font-family: 'Kufam', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        .card-wrapper {
            width: 100%;
            max-width: 360px;
            background: rgba(22, 12, 30, 0.96);
            border: 2px solid #ff4081;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.35);
            padding: 26px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .kitty-pic {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 18px;
            filter: drop-shadow(0 4px 12px rgba(255, 64, 129, 0.25));
        }

        .dialogue-text {
            color: #ffffff;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 22px;
            white-space: pre-line;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
            font-weight: 600;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff4081, #d81b60);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 13px 40px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Kufam', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }
        .action-btn:active { transform: scale(0.95); }

        .big-heart-btn {
            background: none;
            border: none;
            font-size: 70px;
            cursor: pointer;
            animation: pulseHeart 1.2s infinite;
            filter: drop-shadow(0 0 15px rgba(255, 64, 129, 0.7));
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .player-box {
            display: none;
            background: rgba(255, 64, 129, 0.1);
            border: 1px solid rgba(255, 64, 129, 0.3);
            border-radius: 20px;
            padding: 18px;
            margin-top: 15px;
        }
        .cover-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4081;
            box-shadow: 0 0 18px rgba(255, 64, 129, 0.5);
            margin: 0 auto 12px auto;
            display: block;
        }
        .player-title {
            color: #ff80ab;
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: 800;
        }
        .audio-control-btn {
            background: #ff4081;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-family: 'Kufam', sans-serif;
            font-size: 14px;
            cursor: pointer;
        }

        .heart-particle {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="img-container" id="imgBox">
            <img id="kittyImg" class="kitty-pic" src="kitty1.png" alt="Hello Kitty" onerror="this.onerror=null; this.src='kitty1.jpg';">
        </div>
        <div class="dialogue-text" id="sceneText">أنتِ آياتي؟ 🥺</div>
        
        <div id="btnArea">
            <button class="action-btn" onclick="goNext()">هلو 💕</button>
        </div>

        <div class="player-box" id="musicPlayer">
            <img src="my-love.jpg" alt="آياتي" class="cover-photo">
            <div class="player-title">رحمة رياض - ويلي 🎵</div>
            <button class="audio-control-btn" id="playBtn" onclick="toggleAudio()">إيقاف مؤقت ⏸️</button>
        </div>
    </div>

    <audio id="bgSong" src="song.mp3" loop preload="auto"></audio>
