<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آياتي 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #201b22;
            font-family: 'Kufam', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .card-wrapper {
            width: 320px;
            background: rgba(30, 24, 33, 0.95);
            border: 2px solid #ff4081;
            border-radius: 28px;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.4);
            padding: 24px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
        }

        .img-container {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .img-container img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 16px;
        }

        .dialogue-text {
            color: #ffffff;
            font-size: 16px;
            line-height: 1.8;
            min-height: 55px;
            margin-bottom: 20px;
            white-space: pre-line;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn {
            background: #ff4081;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Kufam', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            transition: transform 0.2s, background 0.2s;
        }
        .action-btn:active {
            transform: scale(0.95);
        }

        .big-heart-btn {
            background: none;
            border: none;
            font-size: 65px;
            cursor: pointer;
            animation: pulseHeart 1.2s infinite;
            filter: drop-shadow(0 0 12px rgba(255, 64, 129, 0.8));
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .player-box {
            display: none;
            background: rgba(255, 64, 129, 0.1);
            border: 1px solid rgba(255, 64, 129, 0.3);
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
        }
        .player-title {
            color: #ff80ab;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .player-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .player-progress {
            width: 50%;
            height: 100%;
            background: #ff4081;
            box-shadow: 0 0 8px #ff4081;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 22px;
            color: #ffffff;
        }

        .heart-particle {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <div class="img-container" id="imgBox">
            <img id="sceneImg" src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" alt="Hello Kitty">
        </div>
        <div class="dialogue-text" id="sceneText">أنتِ آياتي؟ 🥺</div>
        
        <div id="btnArea">
            <button class="action-btn" id="nextBtn" onclick="nextStep()">هلو آياتي 🌸</button>
        </div>

        <!-- مشغل الموسيقى مع صورة حبيبتك كواجهة -->
        <div class="player-box" id="musicPlayer">
            <div style="margin-bottom: 12px;">
                <img src="my-love.jpg" alt="آياتي" style="width: 130px; height: 130px; border-radius: 18px; object-fit: cover; border: 2px solid #ff4081; box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);">
            </div>
            <div class="player-title">أغنيتنا المفضلة: رحمة رياض - ويلي 🎵</div>
            <div class="player-bar">
                <div class="player-progress"></div>
            </div>
            <div class="player-controls">
                <span>⏮️</span>
                <span>⏸️</span>
                <span>⏭️</span>
            </div>
        </div>
    </div>

    <!-- ملف الأغنية -->
    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <script>
        let currentStep = 0;

        const steps = [
            {
                img: "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif",
                text: "أيوته.. عندي سؤاال 🙈",
                btn: "شنو هو؟ 💕"
            },
            {
                img: "https://media.giphy.com/media/l41lFw0NUFUmeZfVK/giphy.gif",
                text: "بس مستحي أسألك إياه 🥺👉👈",
                btn: "اسألني.. يلا ❤️"
            },
            {
                img: "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
                text: "تحبين عمر لو لا؟ 👀💖",
                btn: "ها؟ 🙈"
            },
            {
                img: "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
                text: "شنو ها؟ تحبين عمر لو لا؟ 🥺",
                btn: "مدري 🤭"
            },
            {
                img: "https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif",
                text: "إذا تحبين عمر.. دوسي على هذا القلب 💖",
                isHeart: true
            },
            {
                img: "",
                hideImg: true,
                text: "في حبك ماذا أقول؟\nالقلم حائر بين السطور..\nأرسم ورداً فلديكِ أطيب العطور 🌸\nلو قلت أحبكِ فلن تكفيني،\nفأنا مريض بحبكِ فمن يداويني؟ 💖",
                btn: "أعشقك وأحبك 🥹❤️",
                showPlayer: true
            }
        ];

        function nextStep() {
            const audio = document.getElementById('bgSong');
            if (audio.paused) {
                audio.play().catch(e => console.log("Audio play deferred"));
            }

            if (currentStep < steps.length) {
                const s = steps[currentStep];
                const imgBox = document.getElementById('imgBox');
                const sceneImg = document.getElementById('sceneImg');
                const sceneText = document.getElementById('sceneText');
                const btnArea = document.getElementById('btnArea');

                sceneText.innerText = s.text;

                if (s.hideImg) {
                    imgBox.style.display = 'none';
                } else {
                    imgBox.style.display = 'flex';
                    sceneImg.src = s.img;
                }

                if (s.isHeart) {
                    btnArea.innerHTML = `<button class="big-heart-btn" onclick="nextStep()">💖</button>`;
                } else {
                    btnArea.innerHTML = `<button class="action-btn" onclick="nextStep()">${s.btn}</button>`;
                }

                if (s.showPlayer) {
                    document.getElementById('musicPlayer').style.display = 'block';
                    btnArea.innerHTML = `<div style="color: #ff80ab; font-weight: 800; font-size: 20px; margin-top: 10px;">أعشقك وأحبك يا عمر 🥹❤️</div>`;
                }

                currentStep++;
            }
        }

        setInterval(function() {
            const h = document.createElement('div');
            h.innerHTML = '💖';
            h.className = 'heart-particle';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 14 + 12 + 'px';
            h.style.animationDuration = Math.random() * 3 + 2.5 + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 400);
    </script>
</body>
</html>
