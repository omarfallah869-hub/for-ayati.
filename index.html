<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آياتي 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #161219;
            font-family: 'Kufam', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }
        
        .card-wrapper {
            width: 100%;
            max-width: 350px;
            background: rgba(30, 22, 34, 0.98);
            border: 2px solid #ff4081;
            border-radius: 28px;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.45);
            padding: 24px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .img-container {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .img-container svg {
            width: 140px;
            height: 140px;
        }

        .dialogue-text {
            color: #ffffff;
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 20px;
            white-space: pre-line;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
        }

        .action-btn {
            background: #ff4081;
            color: #ffffff;
            border: none;
            border-radius: 22px;
            padding: 12px 34px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Kufam', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            transition: transform 0.15s ease;
        }
        .action-btn:active {
            transform: scale(0.95);
        }

        .big-heart-btn {
            background: none;
            border: none;
            font-size: 65px;
            cursor: pointer;
            animation: pulseHeart 1.2s infinite;
            filter: drop-shadow(0 0 14px rgba(255, 64, 129, 0.8));
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .player-box {
            display: none;
            background: rgba(255, 64, 129, 0.12);
            border: 1px solid rgba(255, 64, 129, 0.35);
            border-radius: 20px;
            padding: 16px;
            margin-top: 15px;
        }
        .cover-photo {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid #ff4081;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            margin: 0 auto 12px auto;
            display: block;
        }
        .player-title {
            color: #ff80ab;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .player-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .player-progress {
            width: 65%;
            height: 100%;
            background: #ff4081;
            box-shadow: 0 0 8px #ff4081;
            border-radius: 3px;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 22px;
            color: #ffffff;
            cursor: pointer;
        }

        .heart-particle {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <div class="img-container" id="imgBox">
            <!-- شكل هيلو كيتي اللطيف المدمج مباشرة بالكود -->
            <svg id="kittySvg" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <!-- الرأس والأذنان -->
                <path d="M 45 60 L 30 15 L 75 35 C 90 30 110 30 125 35 L 170 15 L 155 60 C 185 85 185 140 100 140 C 15 140 15 85 45 60 Z" fill="#ffffff" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
                <!-- الفيونكة الوردية -->
                <circle cx="150" cy="45" r="14" fill="#ff4081" stroke="#222" stroke-width="5"/>
                <ellipse cx="130" cy="38" rx="16" ry="12" fill="#ff80ab" stroke="#222" stroke-width="5" transform="rotate(-15 130 38)"/>
                <ellipse cx="170" cy="52" rx="16" ry="12" fill="#ff80ab" stroke="#222" stroke-width="5" transform="rotate(-15 170 52)"/>
                <!-- العينان -->
                <ellipse cx="65" cy="88" rx="7" ry="10" fill="#222"/>
                <ellipse cx="135" cy="88" rx="7" ry="10" fill="#222"/>
                <!-- الأنف الأصفر -->
                <ellipse cx="100" cy="98" rx="9" ry="7" fill="#fbc02d" stroke="#222" stroke-width="3"/>
                <!-- الشوارب -->
                <line x1="25" y1="85" x2="52" y2="88" stroke="#222" stroke-width="5" stroke-linecap="round"/>
                <line x1="22" y1="98" x2="50" y2="98" stroke="#222" stroke-width="5" stroke-linecap="round"/>
                <line x1="25" y1="110" x2="52" y2="106" stroke="#222" stroke-width="5" stroke-linecap="round"/>
                <line x1="175" y1="85" x2="148" y2="88" stroke="#222" stroke-width="5" stroke-linecap="round"/>
                <line x1="178" y1="98" x2="150" y2="98" stroke="#222" stroke-width="5" stroke-linecap="round"/>
                <line x1="175" y1="110" x2="148" y2="106" stroke="#222" stroke-width="5" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="dialogue-text" id="sceneText">أنتِ آياتي؟ 🥺</div>
        
        <div id="btnArea">
            <button class="action-btn" id="nextBtn" onclick="nextStep()">هلو 💕</button>
        </div>

        <!-- مشغل الأغنية مع صورتها كغلاف -->
        <div class="player-box" id="musicPlayer">
            <img id="loveCover" src="my-love.jpg" alt="آياتي" class="cover-photo">
            <div class="player-title">رحمة رياض - ويلي 🎵</div>
            <div class="player-bar">
                <div class="player-progress"></div>
            </div>
            <div class="player-controls">
                <span>⏮️</span>
                <span id="playIcon" onclick="toggleAudio()">⏸️</span>
                <span>⏭️</span>
            </div>
        </div>
    </div>

    <!-- ملف الصوت المرفوع في المستودع -->
    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <script>
        let currentStep = 0;
        const audio = document.getElementById('bgSong');

        const steps = [
            {
                text: "أيوته.. عندي سؤاال 🙈",
                btn: "شنو هو؟ 💕"
            },
            {
                text: "بس مستحي أسألج إياه 👉👈 🥺",
                btn: "اسألني.. يلا ❤️"
            },
            {
                text: "تحبين عمر لو لا؟ 👀💖",
                btn: "ها؟ 🙈"
            },
            {
                text: "شنو ها؟ تحبين عمر لو لا؟ 🥺",
                btn: "مدري 🤭"
            },
            {
                text: "إذا تحبين عمر.. دوسي على هذا القلب 💖",
                isHeart: true
            },
            {
                hideImg: true,
                text: "في حبكِ ماذا أقول؟\nالقلم حائر بين السطور..\nأرسم ورداً فلديكِ أطيب العطور 🌸\nوقلبي يهواكِ ويناديكِ،\nولو كان لي ألف قلب لأحببتكِ ولن يكفيني..\nلو قلت أحبكِ فلن تكفيني،\nفأنا مريض بحبكِ فمن يداويني؟ 💖",
                showPlayer: true
            }
        ];

        function nextStep() {
            // تشغيل الصوت فور أول لمسة للموقع
            if (audio.paused) {
                audio.play().catch(function(e) {
                    console.log("Audio waiting:", e);
                });
            }

            if (currentStep < steps.length) {
                const s = steps[currentStep];
                const imgBox = document.getElementById('imgBox');
                const sceneText = document.getElementById('sceneText');
                const btnArea = document.getElementById('btnArea');

                sceneText.innerText = s.text;

                if (s.hideImg) {
                    imgBox.style.display = 'none';
                }

                if (s.isHeart) {
                    btnArea.innerHTML = `<button class="big-heart-btn" onclick="nextStep()">💖</button>`;
                } else if (s.showPlayer) {
                    document.getElementById('musicPlayer').style.display = 'block';
                    btnArea.innerHTML = `<div style="color: #ff80ab; font-weight: 800; font-size: 19px; margin-top: 15px;">أعشقج وأحبج يا آياتي 🥹❤️</div>`;
                } else {
                    btnArea.innerHTML = `<button class="action-btn" onclick="nextStep()">${s.btn}</button>`;
                }

                currentStep++;
            }
        }

        function toggleAudio() {
            const playIcon = document.getElementById('playIcon');
            if (audio.paused) {
                audio.play();
                playIcon.innerText = "⏸️";
            } else {
                audio.pause();
                playIcon.innerText = "▶️";
            }
        }

        setInterval(function() {
            const h = document.createElement('div');
            h.innerHTML = '💖';
            h.className = 'heart-particle';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 14 + 12 + 'px';
            h.style.animationDuration = Math.random() * 3 + 2.5 + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 400);
    </script>
</body>
</html>
