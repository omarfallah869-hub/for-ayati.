<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آياتي 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0d0811 0%, #1c0e25 100%);
            font-family: 'Kufam', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }
        
        /* تأثير النجوم المتلألئة والقلوب في الخلفية */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255, 64, 129, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .card-wrapper {
            width: 100%;
            max-width: 365px;
            background: rgba(18, 11, 25, 0.95);
            border: 2px solid rgba(255, 64, 129, 0.6);
            border-radius: 32px;
            box-shadow: 0 0 40px rgba(255, 64, 129, 0.25), inset 0 0 15px rgba(255, 64, 129, 0.1);
            padding: 28px 24px;
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .img-container {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        /* تنسيق رسومات Hello Kitty الفاخرة */
        .kitty-graphics {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 8px 16px rgba(255, 64, 129, 0.3));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .dialogue-text {
            color: #ffffff;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 24px;
            white-space: pre-line;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            font-weight: 600;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff4081 0%, #e91e63 100%);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 14px 45px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Kufam', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .action-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -50%; width: 200%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: 0.75s;
            opacity: 0;
        }
        .action-btn:hover::after {
            left: 125%;
            opacity: 1;
        }
        .action-btn:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(255, 64, 129, 0.4);
        }

        .big-heart-btn {
            background: none;
            border: none;
            font-size: 75px;
            cursor: pointer;
            animation: pulseHeart 1.2s infinite;
            filter: drop-shadow(0 0 20px rgba(255, 64, 129, 0.8));
            transition: transform 0.2s;
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        /* مشغل الموسيقى الفخم */
        .player-box {
            display: none;
            background: rgba(255, 64, 129, 0.08);
            border: 1px solid rgba(255, 64, 129, 0.3);
            border-radius: 24px;
            padding: 20px;
            margin-top: 15px;
            animation: slideUp 0.5s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cover-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4081;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
            margin: 0 auto 16px auto;
            display: block;
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .player-title {
            color: #ff80ab;
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: 800;
        }
        .player-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .player-progress {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #ff4081, #ff80ab);
            box-shadow: 0 0 8px #ff4081;
            border-radius: 10px;
            animation: fillBar 15s linear infinite;
        }
        @keyframes fillBar {
            0% { width: 10%; }
            100% { width: 95%; }
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 24px;
            color: #ffffff;
            cursor: pointer;
        }

        .heart-particle {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
            opacity: 0.8;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="card-wrapper" id="card">
        <div class="img-container" id="imgBox">
            <div class="kitty-graphics" id="kittyPlaceholder"></div>
        </div>
        <div class="dialogue-text" id="sceneText">أنتِ آياتي؟ 🥺</div>
        
        <div id="btnArea">
            <button class="action-btn" id="nextBtn" onclick="nextStep()">هلو 💕</button>
        </div>

        <!-- مشغل الأغنية مع صورتها كغلاف -->
        <div class="player-box" id="musicPlayer">
            <img id="loveCover" src="my-love.jpg" alt="آياتي" class="cover-photo">
            <div class="player-title">رحمة رياض - ويلي 🎵</div>
            <div class="player-bar">
                <div class="player-progress"></div>
            </div>
            <div class="player-controls">
                <span>⏮️</span>
                <span id="playIcon" onclick="toggleAudio()">⏸️</span>
                <span>⏭️</span>
            </div>
        </div>
    </div>

    <!-- ملف الصوت المرفوع في المستودع -->
    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

            }

        let currentStep = 0;
        const audio = document.getElementById('bgSong');

        function nextStep() {
            // محاولة تشغيل الصوت مع أول لمسة
            if (audio.paused) {
                audio.play().catch(function(e) {
                    console.log("Audio autostart wait", e);
                });
            }

            if (currentStep < steps.length) {
                const s = steps[currentStep];
                const imgBox = document.getElementById('imgBox');
                const kittyPlaceholder = document.getElementById('kittyPlaceholder');
                const sceneText = document.getElementById('sceneText');
                const btnArea = document.getElementById('btnArea');

                sceneText.innerText = s.text;

                if (s.hideImg) {
                    imgBox.style.display = 'none';
                } else if (s.graphic) {
                    kittyPlaceholder.innerHTML = s.graphic;
                }

                if (s.isHeart) {
                    btnArea.innerHTML = `<button class="big-heart-btn" onclick="nextStep()">💖</button>`;

                    document.getElementById('musicPlayer').style.display = 'block';

                    btnArea.innerHTML = `<button class="action-btn" onclick="nextStep()">${s.btn}</button>`;

        function toggleAudio() {
