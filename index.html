<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آياتي 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #161219;
            font-family: 'Kufam', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }
        
        .card-wrapper {
            width: 100%;
            max-width: 350px;
            background: rgba(30, 22, 34, 0.98);
            border: 2px solid #ff4081;
            border-radius: 28px;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.45);
            padding: 24px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .img-container {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .img-container svg {
            width: 140px;
            height: 140px;
        }

        .dialogue-text {
            color: #ffffff;
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 20px;
            white-space: pre-line;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
        }

        .action-btn {
            background: #ff4081;
            color: #ffffff;
            border: none;
            border-radius: 22px;
            padding: 12px 34px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Kufam', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            transition: transform 0.15s ease;
        }
        .action-btn:active {
            transform: scale(0.95);
        }

        .big-heart-btn {
            background: none;
            border: none;
            font-size: 65px;
            cursor: pointer;
            animation: pulseHeart 1.2s infinite;
            filter: drop-shadow(0 0 14px rgba(255, 64, 129, 0.8));
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .player-box {
            display: none;
            background: rgba(255, 64, 129, 0.12);
            border: 1px solid rgba(255, 64, 129, 0.35);
            border-radius: 20px;
            padding: 16px;
            margin-top: 15px;
        }
        .cover-photo {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid #ff4081;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            margin: 0 auto 12px auto;
            display: block;
        }
        .player-title {
            color: #ff80ab;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .player-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .player-progress {
            width: 65%;
            height: 100%;
            background: #ff4081;
            box-shadow: 0 0 8px #ff4081;
            border-radius: 3px;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 22px;
            color: #ffffff;
            cursor: pointer;
        }

        .heart-particle {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <div class="img-container" id="imgBox">
            <div id="kittyGraphic"></div>
        </div>
        <div class="dialogue-text" id="sceneText">أنتِ آياتي؟ 🥺</div>
        
        <div id="btnArea">
            <button class="action-btn" id="nextBtn" onclick="nextStep()">هلو 💕</button>
        </div>

        <div class="player-box" id="musicPlayer">
            <img id="loveCover" src="my-love.jpg" alt="آياتي" class="cover-photo">
            <div class="player-title">رحمة رياض - ويلي 🎵</div>
            <div class="player-bar">
                <div class="player-progress"></div>
            </div>
            <div class="player-controls">
                <span>⏮️</span>
                <span id="playIcon" onclick="toggleAudio()">⏸️</span>
                <span>⏭️</span>
            </div>
        </div>
    </div>

    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>
