<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آياتي 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f0a14 0%, #1f0d2b 100%);
            font-family: 'Kufam', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        .card-wrapper {
            width: 100%;
            max-width: 360px;
            background: rgba(22, 12, 30, 0.96);
            border: 2px solid #ff4081;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.35);
            padding: 26px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .img-container {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .kitty-box {
            width: 150px;
            height: 150px;
            filter: drop-shadow(0 6px 12px rgba(255, 64, 129, 0.3));
        }

        .dialogue-text {
            color: #ffffff;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 22px;
            white-space: pre-line;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
            font-weight: 600;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff4081, #d81b60);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 13px 40px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Kufam', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            display: inline-block;
        }
        .action-btn:active {
            transform: scale(0.95);
        }

        .big-heart-btn {
            background: none;
            border: none;
            font-size: 70px;
            cursor: pointer;
            animation: pulseHeart 1.2s infinite;
            filter: drop-shadow(0 0 15px rgba(255, 64, 129, 0.7));
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .player-box {
            display: none;
            background: rgba(255, 64, 129, 0.1);
            border: 1px solid rgba(255, 64, 129, 0.3);
            border-radius: 20px;
            padding: 18px;
            margin-top: 15px;
        }
        .cover-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4081;
            box-shadow: 0 0 18px rgba(255, 64, 129, 0.5);
            margin: 0 auto 12px auto;
            display: block;
        }
        .player-title {
            color: #ff80ab;
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: 800;
        }
        .audio-control-btn {
            background: #ff4081;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-family: 'Kufam', sans-serif;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }

        .heart-particle {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="img-container" id="imgBox">
            <div class="kitty-box" id="kittyArea"></div>
        </div>
        <div class="dialogue-text" id="sceneText">أنتِ آياتي؟ 🥺</div>
        
        <div id="btnArea">
            <button class="action-btn" onclick="goNext()">هلو 💕</button>
        </div>

        <div class="player-box" id="musicPlayer">
            <img src="my-love.jpg" alt="آياتي" class="cover-photo">
            <div class="player-title">رحمة رياض - ويلي 🎵</div>
            <button class="audio-control-btn" id="playBtn" onclick="toggleAudio()">تشغيل الأغنية ▶️</button>
        </div>
    </div>

    <audio id="bgSong" src="song.mp3" loop preload="auto"></audio>

    <script>
        // رسومات Hello Kitty بصيغة SVG خفيفة ومباشرة تضمن عدم التعليق
        const svgs = {
            hello: `<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <path d="M 45 60 L 30 15 L 75 35 C 90 30 110 30 125 35 L 170 15 L 155 60 C 185 85 185 140 100 140 C 15 140 15 85 45 60 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="5"/>
                <circle cx="145" cy="45" r="13" fill="#ff4081" stroke="#1d1d1d" stroke-width="4"/>
                <ellipse cx="127" cy="38" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 127 38)"/>
                <ellipse cx="163" cy="52" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 163 52)"/>
                <ellipse cx="65" cy="85" rx="6.5" ry="9.5" fill="#1d1d1d"/>
                <ellipse cx="135" cy="85" rx="6.5" ry="9.5" fill="#1d1d1d"/>
                <ellipse cx="100" cy="95" rx="8" ry="6" fill="#fbc02d" stroke="#1d1d1d" stroke-width="2.5"/>
                <line x1="28" y1="84" x2="51" y2="87" stroke="#1d1d1d" stroke-width="4"/>
                <line x1="25" y1="96" x2="49" y2="96" stroke="#1d1d1d" stroke-width="4"/>
                <line x1="172" y1="84" x2="149" y2="87" stroke="#1d1d1d" stroke-width="4"/>
                <line x1="175" y1="96" x2="151" y2="96" stroke="#1d1d1d" stroke-width="4"/>
            </svg>`,
            shy: `<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <path d="M 45 60 L 30 15 L 75 35 C 90 30 110 30 125 35 L 170 15 L 155 60 C 185 85 185 140 100 140 C 15 140 15 85 45 60 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="5"/>
                <circle cx="145" cy="45" r="13" fill="#ff4081" stroke="#1d1d1d" stroke-width="4"/>
                <ellipse cx="127" cy="38" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 127 38)"/>
                <ellipse cx="163" cy="52" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 163 52)"/>
                <path d="M 54 84 Q 64 76 74 84" fill="none" stroke="#1d1d1d" stroke-width="5" stroke-linecap="round"/>
                <path d="M 126 84 Q 136 76 146 84" fill="none" stroke="#1d1d1d" stroke-width="5" stroke-linecap="round"/>
                <ellipse cx="48" cy="98" rx="11" ry="6" fill="#ff80ab"/>
                <ellipse cx="152" cy="98" rx="11" ry="6" fill="#ff80ab"/>
                <ellipse cx="100" cy="94" rx="8" ry="6" fill="#fbc02d" stroke="#1d1d1d" stroke-width="2.5"/>
                <!-- أصابع خجل متقابلة للداخل مضبوطة تماماً -->
                <g transform="translate(68, 122)">
                    <path d="M 0 5 C 0 0, 15 0, 15 5 L 15 10 C 15 13, 0 13, 0 10 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
                    <path d="M 15 3 C 15 0, 32 0, 32 4 L 32 6 C 32 10, 15 10, 15 6 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
                    <path d="M 64 5 C 64 0, 49 0, 49 5 L 49 10 C 49 13, 64 13, 64 10 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
                    <path d="M 49 3 C 49 0, 32 0, 32 4 L 32 6 C 32 10, 49 10, 49 6 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
                </g>
            </svg>`,
            wink: `<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <path d="M 45 60 L 30 15 L 75 35 C 90 30 110 30 125 35 L 170 15 L 155 60 C 185 85 185 140 100 140 C 15 140 15 85 45 60 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="5"/>
                <circle cx="145" cy="45" r="13" fill="#ff4081" stroke="#1d1d1d" stroke-width="4"/>
                <ellipse cx="127" cy="38" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 127 38)"/>
                <ellipse cx="163" cy="52" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 163 52)"/>
                <path d="M 52 86 Q 64 94 74 86" fill="none" stroke="#1d1d1d" stroke-width="5" stroke-linecap="round"/>
                <ellipse cx="132" cy="85" rx="6.5" ry="9.5" fill="#1d1d1d"/>
                <ellipse cx="100" cy="95" rx="8" ry="6" fill="#fbc02d" stroke="#1d1d1d" stroke-width="2.5"/>
            </svg>`,
            love: `<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <path d="M 45 60 L 30 15 L 75 35 C 90 30 110 30 125 35 L 170 15 L 155 60 C 185 85 185 140 100 140 C 15 140 15 85 45 60 Z" fill="#ffffff" stroke="#1d1d1d" stroke-width="5"/>
                <circle cx="145" cy="45" r="13" fill="#ff4081" stroke="#1d1d1d" stroke-width="4"/>
                <ellipse cx="127" cy="38" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 127 38)"/>
                <ellipse cx="163" cy="52" rx="15" ry="11" fill="#ff80ab" stroke="#1d1d1d" stroke-width="4" transform="rotate(-15 163 52)"/>
                <text x="48" y="96" font-size="28" fill="#ff4081">💖</text>
                <text x="118" y="96" font-size="28" fill="#ff4081">💖</text>
                <ellipse cx="100" cy="98" rx="8" ry="6" fill="#fbc02d" stroke="#1d1d1d" stroke-width="2.5"/>
            </svg>`
        };

        const scenes = [
            { svg: svgs.hello, text: "أيوته.. عندي سؤاال 🙈", btn: "شنو هو؟ 💕" },
            { svg: svgs.shy, text: "بس مستحي أسألج إياه 👉👈 🥺", btn: "اسألني.. يلا ❤️" },
            { svg: svgs.wink, text: "تحبين عمر لو لا؟ 👀💖", btn: "ها؟ 🙈" },
            { svg: svgs.shy, text: "شنو ها؟ تحبين عمر لو لا؟ 🥺", btn: "مدري 🤭" },
            { svg: svgs.love, text: "إذا تحبين عمر.. دوسي على هذا القلب 💖", isHeart: true },
            { 
                hide: true,
                text: "في حبكِ ماذا أقول؟\nالقلم حائر بين السطور..\nأرسم ورداً فلديكِ أطيب العطور 🌸\nوقلبي يهواكِ ويناديكِ،\nولو كان لي ألف قلب لأحببتكِ ولن يكفيني..\nلو قلت أحبكِ فلن تكفيني،\nفأنا مريض بحبكِ فمن يداويني؟ 💖",
                final: true 
            }
        ];

        let index = 0;
        document.getElementById('kittyArea').innerHTML = svgs.hello;

        function goNext() {
            if (index < scenes.length) {
                const item = scenes[index];
                document.getElementById('sceneText').innerText = item.text;

                if (item.hide) {
                    document.getElementById('imgBox').style.display = 'none';
                } else if (item.svg) {
                    document.getElementById('kittyArea').innerHTML = item.svg;
                }

                if (item.isHeart) {
                    document.getElementById('btnArea').innerHTML = `<button class="big-heart-btn" onclick="goNext()">💖</button>`;
                } else if (item.final) {
                    document.getElementById('musicPlayer').style.display = 'block';
                    document.getElementById('btnArea').innerHTML = `<div style="color: #ff80ab; font-weight: 800; font-size: 20px; margin-top: 15px;">أعشقج وأحبج يا آياتي 🥹❤️</div>`;
                    // تشغيل الصوت بعد الضغط على القلب الأخير
                    const a = document.getElementById('bgSong');
                    a.play().catch(function(){});
                } else {
                    document.getElementById('btnArea').innerHTML = `<button class="action-btn" onclick="goNext()">${item.btn}</button>`;
                }

                index++;
            }
        }

        function toggleAudio() {
            const a = document.getElementById('bgSong');
            const btn = document.getElementById('playBtn');
            if (a.paused) {
                a.play();
                btn.innerText = "إيقاف مؤقت ⏸️";
            } else {
                a.pause();
                btn.innerText = "تشغيل الأغنية ▶️";
            }
        }

        setInterval(function() {
            const h = document.createElement('div');
            h.innerHTML = '💖';
            h.className = 'heart-particle';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 16 + 12 + 'px';
            h.style.animationDuration = Math.random() * 3 + 2.5 + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 350);
    </script>
</body>
</html>
